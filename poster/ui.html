<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="poster-token" content="{{.Token}}" />
    <title>poster</title>
    <style nonce="{{.Nonce}}">
      @font-face {
        font-family: 'DepartureMono';
        src: url('/assets/fonts/DepartureMono-Regular.woff2') format('woff2');
      }

      :root {
        --bg-dark: #05060a;
        --bg-card: rgba(14, 14, 24, 0.72);
        --border: rgba(180, 140, 255, 0.25);
        --border-bright: #b48cff;
        --text: #cfc8e6;
        --text-faded: #7d7799;
        --accent-violet: #b48cff;
        --accent-teal: #57cbde;
        --accent-pink: #ff6b9d;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 24px;
        font-family: 'DepartureMono', monospace;
        font-size: 12px;
        line-height: 1.7;
        color: var(--text);
        background: var(--bg-dark);
      }

      .tab-bar {
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
      }

      .tab-btn,
      .submit-btn {
        padding: 6px 14px;
        font: inherit;
        letter-spacing: 0.1em;
        color: var(--accent-violet);
        background: var(--bg-card);
        border: 1px solid var(--border);
        text-decoration: none;
        cursor: pointer;
        transition: border-color 0.3s ease, transform 0.3s ease;
      }

      .tab-btn:hover,
      .submit-btn:hover {
        border-color: var(--border-bright);
        transform: translateY(-2px);
      }

      .tab-btn[aria-selected='true'] {
        color: var(--bg-dark);
        background: var(--accent-violet);
      }

      .submit-btn {
        align-self: flex-start;
        color: var(--accent-teal);
      }

      .workspace {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 16px;
      }

      .post-form,
      .preview-card {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 16px;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-left: 3px solid var(--accent-violet);
        backdrop-filter: blur(10px);
      }

      .post-form[hidden] {
        display: none;
      }

      .preview-card {
        border-left-color: var(--accent-pink);
      }

      .field-label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 10px;
        letter-spacing: 0.1em;
        color: var(--text-faded);
      }

      .field-input {
        padding: 8px;
        font: inherit;
        font-size: 12px;
        color: var(--text);
        background: rgba(2, 3, 6, 0.6);
        border: 1px solid var(--border);
        transition: border-color 0.3s ease;
      }

      .field-input:focus {
        outline: none;
        border-color: var(--border-bright);
      }

      .field-body {
        min-height: 320px;
        resize: vertical;
      }

      .panel-title {
        margin: 0;
        font-size: 12px;
        letter-spacing: 0.14em;
        color: var(--accent-violet);
      }

      .preview-img {
        max-width: 100%;
        border: 1px solid var(--border);
      }

      .preview-body {
        overflow-wrap: anywhere;
      }

      .preview-body a {
        color: var(--accent-teal);
      }

      .tag-row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .tag-chip {
        padding: 3px 8px;
        font: inherit;
        letter-spacing: 0.08em;
        color: var(--text-faded);
        background: rgba(2, 3, 6, 0.6);
        border: 1px solid var(--border);
        cursor: pointer;
        transition: border-color 0.3s ease, color 0.3s ease;
      }

      .tag-chip:hover {
        color: var(--accent-teal);
        border-color: var(--accent-teal);
      }

      .tag-picked .tag-chip {
        color: var(--accent-violet);
        border-color: var(--border-bright);
      }

      .tag-picked .tag-chip:hover {
        color: var(--accent-pink);
        border-color: var(--accent-pink);
      }

      .tag-new {
        flex: 1;
        min-width: 0;
      }

      .field-check {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 10px;
        letter-spacing: 0.1em;
        color: var(--text-faded);
        cursor: pointer;
      }

      .field-check input {
        accent-color: var(--accent-violet);
      }

      .status-line {
        min-height: 1.7em;
        margin: 16px 0 0;
        color: var(--accent-teal);
      }

      .status-line.status-error {
        color: var(--accent-pink);
      }

      @media (max-width: 1024px) {
        .workspace {
          grid-template-columns: minmax(0, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <div class="tab-bar" role="tablist" aria-label="post type">
      <button class="tab-btn" type="button" role="tab" id="tab-blog" aria-controls="form-blog" aria-selected="true">weblog</button>
      <button class="tab-btn" type="button" role="tab" id="tab-gallery" aria-controls="form-gallery" aria-selected="false">gallery</button>
      <a class="tab-btn" href="/site/" target="_blank" rel="noopener noreferrer">view site</a>
    </div>

    <div class="workspace">
      <form class="post-form" id="form-blog" action="/blog">
        <label class="field-label">title<input class="field-input" name="title" required /></label>
        <div class="field-label tag-builder">
          tags
          <div class="tag-row tag-picked"></div>
          <div class="tag-row tag-common"></div>
          <div class="tag-row">
            <input class="field-input tag-new" placeholder="new tag" aria-label="new tag" />
            <button class="tag-chip tag-add" type="button">+ add</button>
          </div>
          <input type="hidden" name="tags" />
        </div>
        <label class="field-label">quote<input class="field-input" name="quote" /></label>
        <label class="field-label">author<input class="field-input" name="author" value="requiem" /></label>
        <label class="field-label">image, converted to webp<input class="field-input" type="file" name="image" accept=".png,.jpg,.jpeg,.gif,.webp,.avif,.heic,.bmp,.tif,.tiff" /></label>
        <label class="field-label">body, markdown<textarea class="field-input field-body" name="body" required></textarea></label>
        <div class="tag-row">
          <label class="field-check"><input type="checkbox" name="commit" />git commit</label>
          <label class="field-check"><input type="checkbox" name="push" />git push</label>
        </div>
        <button class="submit-btn">post</button>
      </form>

      <form class="post-form" id="form-gallery" action="/gallery" hidden>
        <label class="field-label">caption<input class="field-input" name="caption" required /></label>
        <div class="field-label tag-builder">
          tags
          <div class="tag-row tag-picked"></div>
          <div class="tag-row tag-common"></div>
          <div class="tag-row">
            <input class="field-input tag-new" placeholder="new tag" aria-label="new tag" />
            <button class="tag-chip tag-add" type="button">+ add</button>
          </div>
          <input type="hidden" name="tags" />
        </div>
        <label class="field-label">image, converted to webp<input class="field-input" type="file" name="image" accept=".png,.jpg,.jpeg,.gif,.webp,.avif,.heic,.bmp,.tif,.tiff" required /></label>
        <div class="tag-row">
          <label class="field-check"><input type="checkbox" name="commit" />git commit</label>
          <label class="field-check"><input type="checkbox" name="push" />git push</label>
        </div>
        <button class="submit-btn">post</button>
      </form>

      <section class="preview-card" aria-label="preview">
        <h2 class="panel-title">::PREVIEW</h2>
        <img class="preview-img" id="preview-img" alt="" hidden />
        <div class="preview-body" id="preview-body"></div>
      </section>
    </div>

    <p class="status-line" id="status-line" role="status"></p>

    <script src="/assets/js/marked.min.js"></script>
    <script src="/assets/js/purify.min.js"></script>
    <script nonce="{{.Nonce}}">
      (function () {
        var token = document.querySelector('meta[name="poster-token"]').content;
        var forms = [document.getElementById('form-blog'), document.getElementById('form-gallery')];
        var tabs = [document.getElementById('tab-blog'), document.getElementById('tab-gallery')];
        var previewImg = document.getElementById('preview-img');
        var previewBody = document.getElementById('preview-body');
        var statusLine = document.getElementById('status-line');

        var commonTags = {{.Tags}};

        function tagChip(label, onClick) {
          var chip = document.createElement('button');
          chip.type = 'button';
          chip.className = 'tag-chip';
          chip.textContent = label;
          chip.addEventListener('click', onClick);
          return chip;
        }

        forms.forEach(function (form) {
          var picked = [];
          var fresh = form.querySelector('.tag-new');

          function renderTags() {
            form.elements.tags.value = picked.join(',');
            form.querySelector('.tag-picked').replaceChildren.apply(
              form.querySelector('.tag-picked'),
              picked.map(function (tag) {
                return tagChip('- ' + tag, function () {
                  picked.splice(picked.indexOf(tag), 1);
                  renderTags();
                });
              })
            );
            form.querySelector('.tag-common').replaceChildren.apply(
              form.querySelector('.tag-common'),
              commonTags
                .filter(function (tag) {
                  return picked.indexOf(tag) < 0;
                })
                .map(function (tag) {
                  return tagChip('+ ' + tag, function () {
                    picked.push(tag);
                    renderTags();
                  });
                })
            );
          }

          function addFresh() {
            var tag = fresh.value.replace(/,/g, ' ').trim();
            fresh.value = '';
            if (tag && picked.indexOf(tag) < 0) picked.push(tag);
            renderTags();
          }

          form.querySelector('.tag-add').addEventListener('click', addFresh);
          fresh.addEventListener('keydown', function (e) {
            if (e.key !== 'Enter') return;
            e.preventDefault();
            addFresh();
          });
          form.addEventListener('reset', function () {
            picked = [];
            renderTags();
          });
          renderTags();
        });


        function renderPreview() {
          var form = forms[0].hidden ? forms[1] : forms[0];
          var text = form.elements.body ? form.elements.body.value : form.elements.caption.value;
          previewBody.innerHTML = DOMPurify.sanitize(marked.parse(text));
          var file = form.elements.image.files[0];
          URL.revokeObjectURL(previewImg.src);
          previewImg.hidden = !file;
          if (file) previewImg.src = URL.createObjectURL(file);
        }

        tabs.forEach(function (tab, i) {
          tab.addEventListener('click', function () {
            tabs.forEach(function (t, j) {
              t.setAttribute('aria-selected', i === j);
              forms[j].hidden = i !== j;
            });
            renderPreview();
          });
        });

        forms.forEach(function (form) {
          form.addEventListener('input', renderPreview);
          form.addEventListener('submit', function (e) {
            e.preventDefault();
            var button = form.querySelector('.submit-btn');
            button.disabled = true;
            statusLine.className = 'status-line';
            statusLine.textContent = 'writing...';
            fetch(form.getAttribute('action'), {
              method: 'POST',
              headers: { 'X-Poster-Token': token },
              body: new FormData(form)
            })
              .then(function (res) {
                return res.json();
              })
              .then(function (out) {
                if (out.error) throw new Error(out.error);
                statusLine.textContent = out.done;
                var commit = form.elements.commit.checked;
                var push = form.elements.push.checked;
                form.reset();
                form.elements.commit.checked = commit;
                form.elements.push.checked = push;
                renderPreview();
              })
              .catch(function (err) {
                statusLine.className = 'status-line status-error';
                statusLine.textContent = 'signal lost: ' + err.message;
              })
              .finally(function () {
                button.disabled = false;
              });
          });
        });
      })();
    </script>
  </body>
</html>
