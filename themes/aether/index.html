<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>::Requiem :: aether</title>
    <meta name="description" content="requiem's weblog, memos, gallery, stories and webring as a node on the wire, drawn entirely in WebGL." />
    <meta name="author" content="requiem" />
    <meta name="theme-color" content="#020306" />
    <link rel="canonical" href="https://requiem.moe/" />
    <link rel="preload" href="../../assets/fonts/DepartureMono-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #020306; color: #d7e6ff; font: 14px ui-monospace, monospace; }
      canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
      .plain { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
      .plain.shown { position: static; width: auto; height: auto; clip-path: none; padding: 16px; }
      .plain a { color: #b48cff; }
    </style>
  </head>
  <body>
    <canvas id="wire" role="img" aria-label="requiem's weblog, memos, gallery, stories and webring, drawn in WebGL"></canvas>
    <p class="plain" id="nogl">this theme draws everything in WebGL. <a href="../../">read the plain site instead</a>.</p>
    <script src="./aether.js"></script>
  </body>
</html>
